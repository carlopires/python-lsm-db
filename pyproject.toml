[build-system]
requires = ["setuptools>=77", "wheel", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-lsm1"
version = "0.9.0"
description = "Python bindings for SQLite's LSM1 key/value store"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "SQLITE_LICENSE"]
authors = [
    { name = "Charles Leifer", email = "coleifer@gmail.com" }
]
maintainers = [
    { name = "Carlo Pires", email = "carlopires@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/carlopires/python-lsm-db"
Documentation = "https://github.com/carlopires/python-lsm-db/tree/master/docs"
Issues = "https://github.com/carlopires/python-lsm-db/issues"
